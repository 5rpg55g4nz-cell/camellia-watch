<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Camellia">
<title>Camellia Watch</title>

<style>
:root {
  color-scheme: light dark;
  --bg: #f5f5f7;
  --card: #fff;
  --text: #1d1d1f;
  --sub: #86868b;
  --line: #e5e5ea;
  --blue: #007aff;
  --green: #30b85a;
  --red: #ff453a;
  --orange: #ff9f0a;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000;
    --card: #1c1c1e;
    --text: #f5f5f7;
    --sub: #98989d;
    --line: #38383a;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Helvetica Neue", sans-serif;
}

main {
  max-width: 600px;
  margin: auto;
  padding: 24px 16px 50px;
}

h1 {
  font-size: 34px;
  letter-spacing: -1.5px;
  margin: 8px 0;
}

.sub {
  font-size: 12px;
  color: var(--sub);
}

.card {
  background: var(--card);
  border-radius: 22px;
  padding: 22px;
  margin-top: 16px;
}

.route {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 30px;
  font-weight: 700;
}

.center { text-align: center; }

.status {
  font-size: 34px;
  font-weight: 750;
  margin: 16px 0;
}

.red { color: var(--red); }
.green { color: var(--green); }
.gray { color: var(--sub); }
.orange { color: var(--orange); }

.metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.metric {
  font-size: 24px;
  font-weight: 700;
  margin-top: 12px;
}

.room {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
}

.room:last-child {
  border-bottom: none;
}

.room-name {
  font-size: 15px;
  font-weight: 600;
}

.price {
  font-size: 13px;
  color: var(--sub);
  margin-top: 5px;
}

.room-status {
  font-size: 13px;
  text-align: right;
  flex-shrink: 0;
}

button, .booking {
  display: block;
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 16px;
  background: var(--blue);
  color: white;
  text-align: center;
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  margin-top: 16px;
}

.refresh {
  background: var(--card);
  color: var(--blue);
}

#warning {
  color: var(--orange);
  font-size: 13px;
  margin-top: 12px;
}
</style>
</head>

<body>
<main>

<div class="sub">FERRY AVAILABILITY MONITOR</div>
<h1>Camellia Watch</h1>
<div class="sub">Hakata — Busan</div>

<section class="card">
  <div class="route">
    <span>博多</span>
    <span class="gray">→</span>
    <span>釜山</span>
  </div>
  <p class="center sub">
    2026年12月27日（日）｜片道｜大人2名
  </p>
</section>

<section class="card center">
  <div class="sub">AVAILABILITY</div>
  <div id="status" class="status gray">LOADING</div>
  <div id="message" class="sub"></div>
  <div id="warning"></div>
</section>

<div class="metrics">
  <section class="card">
    <div class="sub">CHECK INTERVAL</div>
    <div class="metric">5 min</div>
    <div class="sub">Scheduled</div>
  </section>

  <section class="card">
    <div class="sub">LAST CHECK</div>
    <div id="last" class="metric">--:--</div>
    <div id="date" class="sub"></div>
  </section>
</div>

<section class="card">
  <div class="sub">CABIN AVAILABILITY</div>
  <div id="rooms"></div>
</section>

<a class="booking"
   href="https://www.camellia-line.co.jp/rs/?country=1">
  公式予約サイト
</a>

<button class="refresh" onclick="loadStock()">
  最新データに更新
</button>

<p class="center sub">
  画面更新：30秒間隔<br>
  空席照会：5分間隔で実行予定<br>
  GitHub Actionsの実行遅延が生じる場合があります。
</p>

</main>

<script>
const DATA_URL =
  "https://raw.githubusercontent.com/" +
  "5rpg55g4nz-cell/camellia-watch/main/stock.json";

const roomNames = {
  "161": "2等室",
  "157": "2等寝台",
  "162": "1等和室A",
  "163": "1等洋室B（2名）",
  "164": "1等洋室C（4名）",
  "166": "特等ツイン（2名）",
  "167": "特等ツイン（3名）"
};

let loading = false;

async function loadStock() {
  if (loading) return;
  loading = true;

  const status = document.getElementById("status");
  const message = document.getElementById("message");
  const warning = document.getElementById("warning");
  const rooms = document.getElementById("rooms");

  try {
    const response = await fetch(
      DATA_URL + "?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("データ取得失敗");
    }

    const data = await response.json();

    if (
      data.departure_date !== "2026-12-27" ||
      data.departure !== "博多" ||
      data.destination !== "釜山" ||
      data.adults !== 2
    ) {
      throw new Error("監視条件が一致しません");
    }

    const checked = new Date(data.checked_at);
    const age = Date.now() - checked.getTime();

    const stale =
      !data.checked_at ||
      !Number.isFinite(age) ||
      age < 0 ||
      age > 15 * 60 * 1000;

    document.getElementById("last").textContent =
      checked.toLocaleTimeString("ja-JP", {
        timeZone: "Asia/Tokyo",
        hour: "2-digit",
        minute: "2-digit"
      });

    document.getElementById("date").textContent =
      checked.toLocaleDateString("ja-JP", {
        timeZone: "Asia/Tokyo"
      });

    warning.textContent = stale
      ? "最新の照会結果を確認できません"
      : "";

    status.className = "status gray";

    if (stale) {
      status.textContent = "STALE";
    } else if (data.status === "candidate") {
      status.textContent = "VACANCY FOUND";
      status.className = "status green";
      warning.textContent =
        "大人2名の選択確認済み。最終予約可否は公式サイトでご確認ください。";
    } else if (data.status === "sold_out") {
      status.textContent = "SOLD OUT";
      status.className = "status red";
    } else if (data.status === "error") {
      status.textContent = "ERROR";
    } else {
      status.textContent = "UNKNOWN";
    }

    message.textContent =
      data.message || "空席状況未確認";

    rooms.replaceChildren();

    for (const room of data.rooms || []) {
      const row = document.createElement("div");
      row.className = "room";

      const info = document.createElement("div");

      const name = document.createElement("div");
      name.className = "room-name";
      name.textContent =
        roomNames[room.id] || room.name || "客室";

      const price = document.createElement("div");
      price.className = "price";
      price.textContent = room.price || "料金不明";

      info.append(name, price);

      const badge = document.createElement("div");
      badge.className = "room-status gray";

      if (stale || data.status === "error") {
        badge.textContent = "未確認";
      } else if (room.status === "candidate") {
        badge.textContent = "空席候補あり";
        badge.className = "room-status green";
      } else if (room.status === "sold_out") {
        badge.textContent = "売り切れ";
        badge.className = "room-status red";
      } else if (room.status === "ineligible") {
        badge.textContent = "人数条件対象外";
      } else if (room.status === "insufficient") {
        badge.textContent = "残席不足";
      } else {
        badge.textContent = "未確認";
      }

      if (room.remaining != null && !stale &&
          data.status !== "error") {
        const remain = document.createElement("div");
        remain.className = "price";
        const unit = room.remaining_unit === "people"
          ? "人" : "室";
        remain.textContent =
          "残り " + room.remaining + unit;
        badge.append(remain);
      }

      row.append(info, badge);
      rooms.append(row);
    }

  } catch (error) {
    status.textContent = "ERROR";
    status.className = "status gray";
    message.textContent = error.message;
    warning.textContent = "最新情報を取得できません";
    rooms.replaceChildren();
  } finally {
    loading = false;
  }
}

loadStock();
setInterval(loadStock, 30000);

document.addEventListener(
  "visibilitychange",
  () => {
    if (!document.hidden) loadStock();
  }
);
</script>

</body>
</html>
